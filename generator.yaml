ignore:
  resource_names:
    - AccessGrant
    - AccessGrantsInstance
    - AccessGrantsLocation
    # AccessPoint
    - AccessPointForObjectLambda
    - Bucket
    - Job
    - MultiRegionAccessPoint
    - StorageLensGroup
resources:
  AccessPoint:
    exceptions:
      errors:
        404:
          code: NoSuchAccessPoint
    tags:
      ignore: true
    fields:
      Policy:
        from:
          operation: PutAccessPointPolicy
          path: Policy
        is_iam_policy: true
    hooks:
      sdk_read_one_post_set_output:
        template_path: hooks/access_point/sdk_read_one_post_set_output.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/access_point/sdk_create_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdate
sdk_names:
  model_name: s3-control
