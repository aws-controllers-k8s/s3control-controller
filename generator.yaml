ignore:
  resource_names:
    - AccessGrant
    - AccessGrantsInstance
    - AccessGrantsLocation
    # AccessPoint
    - AccessPointForObjectLambda
    - Bucket
    - Job
    - MultiRegionAccessPoint
    - StorageLensGroup
resources:
  AccessPoint:
    exceptions:
      errors:
        404:
          code: NoSuchAccessPoint
    tags:
      ignore: true
    fields:
      # NOTE: Spec.Bucket is deliberately NOT reference-backed. It is polymorphic:
      # for a general purpose bucket it holds the bucket NAME, and for an S3 on
      # Outposts bucket it holds an ARN of the form
      # arn:aws:s3-outposts:<region>:<account>:outpost/<outpost-id>/bucket/<name>.
      # Those are two different resource types carried in two different value
      # formats, and a references block takes exactly one resource and one path,
      # so wiring the general purpose arm would privilege it invisibly and could
      # not serve the Outposts arm at all. Outposts access points are in scope for
      # this resource - see the VPCConfiguration field, which is required for them.
      Policy:
        from:
          operation: PutAccessPointPolicy
          path: Policy
        is_iam_policy: true
      VpcConfiguration.VpcId:
        references:
          resource: VPC
          service_name: ec2
          path: Status.VPCID
    hooks:
      sdk_read_one_post_set_output:
        template_path: hooks/access_point/sdk_read_one_post_set_output.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/access_point/sdk_create_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdate
sdk_names:
  model_name: s3-control
